<!doctype html>
<!--
  GenomeSpy harness for the cross-tool comparison.

  Same shape as index.html (the igv.js harness): everything that varies between
  runs is a URL parameter, so the runner can drive this page exactly as it drives
  a JBrowse build.

    ?track=1000x.shortread.bam    file in ./data
    ?loc=chr22_mask:124000-143000 the shared benchmark window
    ?window=N                     GenomeSpy's lazy-source windowSize (default 30000)

  The workload is BAM alignments, read through GenomeSpy's own `lazy` BAM source
  and laid out by its `pileup` transform — so all three tools read the same bytes
  off the same disk with no server and no preprocessing. The header here used to
  claim the workload was BigWig signal "because GenomeSpy has no alignment
  track"; the spec below has read BAM since it was written, and GenomeSpy does
  have a pileup. The claim was stale, not a description of this file.

  GenomeSpy reads its indexed formats through the same @gmod packages JBrowse
  does, which makes this a renderer comparison over a shared decoder rather than
  a whole-stack one. Say so wherever the numbers appear.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>GenomeSpy harness</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        font-family: sans-serif;
      }
      #gs {
        width: 1280px;
        height: 600px;
      }
    </style>
  </head>
  <body>
    <div id="gs"></div>
    <script type="module">
      import { embed } from './genomespy/index.es.js'

      const params = new URLSearchParams(location.search)
      const track = params.get('track') ?? '20x.shortread.bam'
      const locus = params.get('loc') ?? 'chr22_mask:124000-143000'
      // "chr22_mask:124000-143000" -> ["chr22_mask", 124000, 143000]. The
      // corpus is one contig, so the size is a constant read from the .fai
      // rather than fetched; if the fixture ever grows a second contig this
      // has to become a chrom.sizes URL instead.
      const [chrom, range] = locus.split(':')
      const [start, end] = range.split('-').map(Number)

      const spec = {
        // Root `genomes` + `assembly`, with inline contigs. The corpus assembly
        // is a 250 kb slice of chr22 under a made-up contig name, so there is no
        // published chrom.sizes to point at and no built-in assembly that
        // matches.
        //
        // This was root `genome` until 2026-08-23, which GenomeSpy deprecated:
        // 0.85.0 still ACCEPTS it, registers the assembly, and then never loads
        // it, so the first draw throws "Genome hg19mod has not been loaded yet"
        // — a failure that `embed()` does not reject on, so the harness's own
        // `__gsState.ready` was true on a page displaying an error. The pair of
        // keys is what `rootGenomeConfig.js` asks for now; the deprecated form
        // is not merely noisy, it does not work.
        genomes: { hg19mod: { contigs: [{ name: 'chr22_mask', size: 250001 }] } },
        assembly: 'hg19mod',
        data: {
          lazy: {
            type: 'bam',
            url: `./data/${track}`,
            // indexUrl defaults to url + ".bai", which is how the corpus is
            // named, so it is left alone.
            windowSize: Number(params.get('window') ?? 30000),
          },
        },
        // pileup assigns each read a lane, which is the layout step igv.js and
        // JBrowse also perform; leaving it out would compare a stack of reads
        // against a single overplotted row.
        transform: [{ type: 'pileup', start: 'start', end: 'end', as: 'lane' }],
        mark: { type: 'rect', minWidth: 1 },
        encoding: {
          // The domain belongs on the channel's own scale, not in a root
          // `scales` block: a root block creates a scale resolution the
          // assembly preflight does not walk.
          //
          // This comment used to add that "four genome-declaration forms were
          // tested and all four work once the domain is here". That was wrong,
          // and nothing caught it because no runner drives this page — with the
          // domain here and the deprecated root `genome` above, 0.85.0 throws
          // "Genome hg19mod has not been loaded yet" on the first draw. Putting
          // the domain here is necessary and it is not sufficient.
          x: {
            chrom: 'chrom',
            pos: 'start',
            type: 'locus',
            scale: { domain: [{ chrom, pos: start }, { chrom, pos: end }] },
          },
          x2: { chrom: 'chrom', pos: 'end' },
          y: { field: 'lane', type: 'index', scale: { zoom: false } },
        },
      }

      window.__gsState = { ready: false, error: null }
      embed(document.getElementById('gs'), spec)
        .then(api => {
          window.gsApi = api
          window.__gsState.ready = true
        })
        .catch(e => {
          window.__gsState.error = String(e)
          console.error(e)
        })
    </script>
  </body>
</html>
