<!doctype html>
<!--
  GenomeSpy harness for the cross-tool comparison.

  Same shape as index.html (the igv.js harness): everything that varies between
  runs is a URL parameter, so the runner can drive this page exactly as it drives
  a JBrowse build.

    ?track=1000x.shortread.bam    file in ./data
    ?loc=chr22_mask:124000-143000 the shared benchmark window
    ?window=N                     GenomeSpy's lazy-source windowSize (default 30000)

  The workload is BAM alignments, read through GenomeSpy's own `lazy` BAM source
  and laid out by its `pileup` transform — so all three tools read the same bytes
  off the same disk with no server and no preprocessing. The header here used to
  claim the workload was BigWig signal "because GenomeSpy has no alignment
  track"; the spec below has read BAM since it was written, and GenomeSpy does
  have a pileup. The claim was stale, not a description of this file.

  GenomeSpy reads its indexed formats through the same @gmod packages JBrowse
  does, which makes this a renderer comparison over a shared decoder rather than
  a whole-stack one. Say so wherever the numbers appear.

  ## THIS PAGE DOES NOT WORK on @genome-spy/core 0.85.0, and the arm is off

  It has never worked, and the 2026-08-23 attempt to fix it did not either. It
  paints an empty plot frame, issues **zero** requests for the BAM or its index,
  and reports `__gsState.ready === true` while doing so. Do not read a timing
  off it; `scripts/crosstool/runner.ts` keeps the arm behind GENOMESPY=1 and
  preflights it.

  What is actually wrong, from reading the bundle rather than guessing:

  - The app only *configures* genomes at startup — `configureGenomes(...)` off
    the root spec, and nothing more.
  - The only thing that *loads* one is the view-insertion preflight, which
    collects assemblies by asking each x/y scale resolution for its assembly
    requirement, and only a resolution that has already resolved to type
    `locus` reports one.
  - Our locus scale is not visible to it at that moment, so the preflight
    collects nothing, loads nothing, and the first draw resolves the genome
    against an empty store.

  Three spec forms were tried against 0.85.0, each failing differently:

  | form | result |
  | --- | --- |
  | root `genome` (deprecated) | "Genome hg19mod has not been loaded yet" |
  | root `genomes` + `assembly` | identical — the deprecation notice points here, and it is no better |
  | inline `scale.assembly` object | "No genomes have been configured!" |

  A plain numeric domain was tried too, on the theory that the `{chrom, pos}`
  domain forces genome resolution before the preflight — the stack says it does,
  `getConfiguredDomain` → `fromComplexInterval` → `getLocusGenome` → `getGenome()`
  with no argument — but removing it only changes which call arrives first.

  Every one of these is silent. `embed()` resolves, its promise does not reject,
  `__gsState.error` stays null, and GenomeSpy logs the exception to the console
  itself, so `pageerror` never fires either. Four independent signals read clean
  on a dead page; only the absence of data requests gives it away, which is why
  `toolcheck.ts` counts bytes by URL *path*.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>GenomeSpy harness</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        font-family: sans-serif;
      }
      #gs {
        width: 1280px;
        height: 600px;
      }
    </style>
  </head>
  <body>
    <div id="gs"></div>
    <script type="module">
      import { embed } from './genomespy/index.es.js'

      const params = new URLSearchParams(location.search)
      const track = params.get('track') ?? '20x.shortread.bam'
      const locus = params.get('loc') ?? 'chr22_mask:124000-143000'
      // "chr22_mask:124000-143000" -> ["chr22_mask", 124000, 143000]. The
      // corpus is one contig, so the size is a constant read from the .fai
      // rather than fetched; if the fixture ever grows a second contig this
      // has to become a chrom.sizes URL instead.
      const [chrom, range] = locus.split(':')
      const [start, end] = range.split('-').map(Number)

      // The corpus assembly is a 250 kb slice of chr22 under a made-up contig
      // name, so there is no published chrom.sizes to point at and no built-in
      // assembly that matches. It is declared inline on the scale below rather
      // than at the root, and that is a correctness requirement, not a style.
      //
      // Both root forms are dead ends in 0.85.0. Root `genome` is deprecated.
      // Root `genomes` + `assembly` — what the deprecation notice points at —
      // only *configures*: `getGenome` finds the name registered but not
      // loaded and throws "Genome hg19mod has not been loaded yet. Call
      // ensureAssembly(...)", and nothing on the `embed()` path ever calls it.
      // The bundle's inline-object branch builds the genome synchronously
      // instead, which is why the assembly lives on `x.scale` here.
      //
      // Every one of these failures is silent: `embed()` resolves, the promise
      // does not reject, `__gsState.error` stays null, and the page paints an
      // empty plot frame. Only the absence of data requests gives it away.
      const spec = {
        genomes: { hg19mod: { contigs: [{ name: 'chr22_mask', size: 250001 }] } },
        assembly: 'hg19mod',
        data: {
          lazy: {
            type: 'bam',
            url: `./data/${track}`,
            // indexUrl defaults to url + ".bai", which is how the corpus is
            // named, so it is left alone.
            windowSize: Number(params.get('window') ?? 30000),
          },
        },
        // pileup assigns each read a lane, which is the layout step igv.js and
        // JBrowse also perform; leaving it out would compare a stack of reads
        // against a single overplotted row.
        transform: [{ type: 'pileup', start: 'start', end: 'end', as: 'lane' }],
        mark: { type: 'rect', minWidth: 1 },
        encoding: {
          // The domain belongs on the channel's own scale, not in a root
          // `scales` block: a root block creates a scale resolution the
          // assembly preflight does not walk. Necessary, and not sufficient —
          // see the header.
          x: {
            chrom: 'chrom',
            pos: 'start',
            type: 'locus',
            scale: { domain: [{ chrom, pos: start }, { chrom, pos: end }] },
          },
          x2: { chrom: 'chrom', pos: 'end' },
          y: { field: 'lane', type: 'index', scale: { zoom: false } },
        },
      }

      window.__gsState = { ready: false, error: null }
      embed(document.getElementById('gs'), spec)
        .then(api => {
          window.gsApi = api
          window.__gsState.ready = true
        })
        .catch(e => {
          window.__gsState.error = String(e)
          console.error(e)
        })
    </script>
  </body>
</html>
