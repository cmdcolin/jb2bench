<!doctype html>
<!--
  GenomeSpy harness for the cross-tool comparison.

  Same shape as index.html (the igv.js harness): everything that varies between
  runs is a URL parameter, so the runner can drive this page exactly as it drives
  a JBrowse build.

    ?track=1000x.shortread.bam    file in ./data
    ?loc=chr22_mask:124000-143000 the shared benchmark window
    ?window=N                     GenomeSpy's lazy-source windowSize (default 30000)

  The workload is BAM alignments, read through GenomeSpy's own `lazy` BAM source
  and laid out by its `pileup` transform — so all three tools read the same bytes
  off the same disk with no server and no preprocessing. The header here used to
  claim the workload was BigWig signal "because GenomeSpy has no alignment
  track"; the spec below has read BAM since it was written, and GenomeSpy does
  have a pileup. The claim was stale, not a description of this file.

  GenomeSpy reads its indexed formats through the same @gmod packages JBrowse
  does, which makes this a renderer comparison over a shared decoder rather than
  a whole-stack one. Say so wherever the numbers appear.

  ## THIS PAGE DOES NOT WORK on @genome-spy/core 0.85.0, and the arm is off

  It paints an empty plot frame, issues **zero** requests for the BAM or its
  index, and reports `__gsState.ready === true` while doing so. Do not read a
  timing off it; `scripts/crosstool/runner.ts` keeps the arm behind GENOMESPY=1.

  The spec below is deliberately shaped like GenomeSpy's own published BAM
  example (https://genomespy.app/docs/examples/genomic-data/bam-read-alignments/)
  — root `scales` for the domain, `resolve` + a container root, and an identical
  `x`/`x2` encoding — so that whoever picks this up starts from upstream's form
  rather than from a guess. It still fails.

  ### What the published example settles, and what it cannot

  It disproved a comment that used to sit in this file, claiming the domain
  belongs on the channel because "a root `scales` block creates a scale
  resolution the assembly preflight does not walk". That is backwards. Upstream
  puts the domain in a root `scales` block, and reading the bundle, such a block
  is precisely what attaches view-level scale props and creates the resolution.

  **But that example cannot show how a custom assembly loads, because it never
  loads one.** It declares `assembly: "hg38"`, a *built-in*. Tracing
  `getGenome` in the bundle, a built-in name takes a branch that constructs the
  genome on demand and caches it, so the loader is never involved. A
  *configured* genome — ours, `genomes: { hg19mod: { contigs } }` — takes a
  different branch that refuses with "has not been loaded yet" unless something
  has called `ensureAssembly`. Nothing on the embed path does, for any spec
  shape tried.

  ### Forms tried against 0.85.0, all failing

  | form | result |
  | --- | --- |
  | root `genome` (deprecated) | "Genome hg19mod has not been loaded yet" |
  | root `genomes` + `assembly` | identical |
  | inline `scale.assembly` on the channel | "No genomes have been configured!" |
  | inline `assembly` in root `scales.x` | "No genomes have been configured!" |
  | domain on the channel vs in root `scales` | no change |
  | unit view at root vs `vconcat` + `resolve` | no change |

  The assembly loader itself is not the problem: a `contigs`-only configured
  genome is built synchronously once `ensureAssembly` runs. The problem is that
  it never runs, because the preflight collects assemblies from x/y scale
  resolutions that have resolved to type `locus`, and ours is not among them.

  ### The next thing to try

  Give the corpus a real contig name. The 250 kb slice sits under a made-up
  `chr22_mask`, which forces a custom assembly and therefore the branch that
  does not work. Regenerated onto real `chr22` coordinates it could use
  `assembly: "hg38"` exactly as the example does, and bypass the loader the same
  way. That is a corpus change touching every other benchmark, so it is a
  decision rather than a fix.

  ### Every failure here is silent

  `embed()` resolves, its promise does not reject, `__gsState.error` stays null,
  and GenomeSpy logs the exception itself so `pageerror` never fires. Four
  independent signals read clean on a dead page. Only the absence of data
  requests gives it away, which is why `drewcheck.ts` counts bytes by URL
  *path*. The one 404 in a run is `favicon.ico`, confirmed 2026-08-24 — not a
  missing genome file.

-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>GenomeSpy harness</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        font-family: sans-serif;
      }
      #gs {
        width: 1280px;
        height: 600px;
      }
    </style>
  </head>
  <body>
    <div id="gs"></div>
    <script type="module">
      import { embed } from './genomespy/index.es.js'

      const params = new URLSearchParams(location.search)
      const track = params.get('track') ?? '20x.shortread.bam'
      const locus = params.get('loc') ?? 'chr22_mask:124000-143000'
      // "chr22_mask:124000-143000" -> ["chr22_mask", 124000, 143000]. The
      // corpus is one contig, so the size is a constant read from the .fai
      // rather than fetched; if the fixture ever grows a second contig this
      // has to become a chrom.sizes URL instead.
      const [chrom, range] = locus.split(':')
      const [start, end] = range.split('-').map(Number)

      // The corpus assembly is a 250 kb slice of chr22 under a made-up contig
      // name, so there is no published chrom.sizes to point at and no built-in
      // assembly that matches. It is declared inline on the scale below rather
      // than at the root, and that is a correctness requirement, not a style.
      //
      // Both root forms are dead ends in 0.85.0. Root `genome` is deprecated.
      // Root `genomes` + `assembly` — what the deprecation notice points at —
      // only *configures*: `getGenome` finds the name registered but not
      // loaded and throws "Genome hg19mod has not been loaded yet. Call
      // ensureAssembly(...)", and nothing on the `embed()` path ever calls it.
      // The bundle's inline-object branch builds the genome synchronously
      // instead, which is why the assembly lives on `x.scale` here.
      //
      // Every one of these failures is silent: `embed()` resolves, the promise
      // does not reject, `__gsState.error` stays null, and the page paints an
      // empty plot frame. Only the absence of data requests gives it away.
      const spec = {
        genomes: { hg19mod: { contigs: [{ name: 'chr22_mask', size: 250001 }] } },
        assembly: 'hg19mod',
        // The domain goes in a ROOT `scales` block, which is what GenomeSpy's
        // published BAM example does. An earlier version of this file moved it
        // onto the channel under a comment asserting the opposite — that a root
        // block "creates a scale resolution the assembly preflight does not
        // walk". Backwards: a root `scales` block is precisely what attaches
        // view-level scale props and creates that resolution.
        scales: {
          x: { domain: [{ chrom, pos: start }, { chrom, pos: end }] },
        },
        // A CONTAINER root, not a bare unit view, mirroring that example's
        // `resolve` + `vconcat`. The preflight collects assemblies by asking
        // each x/y scale *resolution* for its requirement, and a shared
        // resolution is what a container creates.
        resolve: { scale: { x: 'shared' } },
        data: {
          lazy: {
            type: 'bam',
            url: `./data/${track}`,
            // indexUrl defaults to url + ".bai", which is how the corpus is
            // named, so it is left alone.
            windowSize: Number(params.get('window') ?? 30000),
          },
        },
        // pileup assigns each read a lane, which is the layout step igv.js and
        // JBrowse also perform; leaving it out would compare a stack of reads
        // against a single overplotted row.
        transform: [{ type: 'pileup', start: 'start', end: 'end', as: 'lane' }],
        vconcat: [
          {
            mark: { type: 'rect', minWidth: 1 },
            encoding: {
              x: { chrom: 'chrom', pos: 'start', type: 'locus' },
              x2: { chrom: 'chrom', pos: 'end' },
              y: { field: 'lane', type: 'index', scale: { zoom: false } },
            },
          },
        ],
      }

      window.__gsState = { ready: false, error: null }
      embed(document.getElementById('gs'), spec)
        .then(api => {
          window.gsApi = api
          window.__gsState.ready = true
        })
        .catch(e => {
          window.__gsState.error = String(e)
          console.error(e)
        })
    </script>
  </body>
</html>
