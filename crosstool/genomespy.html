<!doctype html>
<!--
  GenomeSpy harness for the cross-tool comparison.

  Same shape as index.html (igv.js) and gosling.html: everything that varies
  between runs is a URL parameter, so the runner can drive this page exactly as
  it drives a JBrowse build.

    ?track=1000x.shortread.bam    file in ./data
    ?loc=chr22_mask:124000-143000 the benchmark window
    ?window=N                     lazy-source windowSize; see below for the default

  The workload is BAM alignments through GenomeSpy's own `lazy` BAM source and
  its `pileup` transform, so all four tools read the same bytes off the same disk
  with no server and no preprocessing.

  GenomeSpy reads its indexed formats through the same @gmod packages JBrowse
  does, which makes this a renderer comparison over a shared decoder rather than
  a whole-stack one. Say so wherever the numbers appear.

  ## The spec draws what the other arms draw, and it did not always

  **Until 2026-08-29 this page asked GenomeSpy for `mark: rect` and a `pileup`
  transform and nothing else** — flat rectangles, one per read. JBrowse and
  igv.js were meanwhile drawing a coverage track and per-base mismatches on top
  of their pileups. Screenshots settle it: counting distinct saturated hues in
  the read band, igv scored 207 and JBrowse 12, against **2 for GenomeSpy**. The
  arm was winning the light cells partly by drawing less, and "a renderer
  comparison over a shared decoder" is not true of two arms drawing different
  pictures.

  So the spec now carries the layers GenomeSpy's own published BAM example
  carries, and that JBrowse draws here: a coverage track with mismatch support,
  a directional `arrow` backbone per read, CIGAR overlays for deletions, skips
  and insertions, and per-base mismatch rects coloured by base. Same palette as
  their example, so the colours are theirs. It scores 53 hues now.

  **What is deliberately left out, and why.** Their example also draws the base
  letter inside each mismatch and an "I"/"S" glyph for insertions and soft
  clips. At this window a base is 1/15th of a pixel, so no arm displays readable
  text and JBrowse draws none — including them would price a feature nobody
  sees. Their two interactive sliders (`minMapq`, `minBaseQuality`) are gone for
  the same reason: they are UI, not drawn content, and one of them filters reads
  *out*, which would cut the workload rather than measure it.

  **`scripts/crosstool/shots.ts` is what caught this, and re-checks it.**
  `drewcheck.ts` cannot: it asks whether a page drew anything from corpus bytes,
  and a page of flat rectangles passes that as cleanly as a full pileup.

  ## The mismatch layers need MD tags, and say nothing when they are missing

  `alignmentMismatches` reads the MD tag, and the layer filters on
  `datum.md != null`, so on a BAM without MD this page draws a pileup with no
  mismatches in it and reports success — the same silent-success shape as every
  other failure here. JBrowse and igv.js reconstruct mismatches from the
  reference and are unaffected, so a no-MD corpus would quietly restore exactly
  the unfair comparison this spec was written to end.

  Every BAM in this corpus carries MD because `shell/generate_alignments.sh`
  runs `samtools calmd`, and `data/20x.shortread.nomd.bam` is that same file
  with the tag stripped, so the dependency is testable on our own synthetic
  reads. Measured: GenomeSpy 87 saturated hues with MD against 0 without,
  Gosling 12 against 0, JBrowse and igv.js unchanged at 19 and 253.

  **CRAM never needs MD** — it is reference-compressed, so the mismatches are
  intrinsic to the format and htslib hands back an MD on decode. Moot here in
  any case, since neither GenomeSpy nor Gosling reads CRAM.

  ## The window is set by zoomTo after embed, not by a domain in the spec

  **A `domain` anywhere on the x scale kills this page on 0.85.0.** Root `scales`
  or the channel, chromosomal `{chrom, pos}` or plain linear numbers, inline
  `scale.assembly` or root `genomes` — every combination fails identically:
  `Genome hg19mod has not been loaded yet. Call ensureAssembly("hg19mod")`,
  zero requests for the BAM, an empty plot frame. Declaring a domain makes
  something read the genome before `assemblyPreflight` has loaded it, and the
  preflight is the only thing on the embed path that ever calls
  `ensureAssembly`.

  So this page declares no domain. It names the x scale, and moves to the window
  afterwards through the API:

      api.getScaleResolutionByName('pos').zoomTo([{chrom, pos: start},
                                                  {chrom, pos: end}])

  which lands on exactly the requested interval — verified by reading the domain
  back, and by 0.93 MB of BAM arriving where the domain forms fetch nothing.

  **What that costs the measurement**: the page renders once at the whole-contig
  view before the zoom. That first frame reads the BAM header and the index and
  then stops, because the lazy source declines to load a view wider than
  `windowSize` — so the extra work is an empty axis frame, not a second pileup.
  The number this arm reports is still navigation-to-pileup, with one cheap frame
  in the middle that the other three arms do not have.

  ## Why a configured genome and not a built-in name

  A built-in assembly (`hg38`, `hg19`, `mm10`, ...) is a hardcoded chrom.sizes
  string in the bundle, and `getGenome` builds one on demand, synchronously, at
  any point in the lifecycle — which is why GenomeSpy's published BAM example
  declares `assembly: "hg38"` and works with a domain. A *configured* genome —
  ours, `genomes: { hg19mod: { contigs } }` — is checked before that fallback
  and throws until the preflight has loaded it.

  Naming a configured genome after a built-in does not help: the configured map
  is consulted first, so `genomes: { hg19: { contigs } }` throws where a bare
  `assembly: "hg19"` would not. The only way to reach the synchronous branch is
  to have no configured genome at all, which means real contig names in the
  corpus — a 250 kb slice regenerated onto `chr22` instead of `chr22_mask`. That
  would make a spec domain work here, and it is a corpus change touching every
  other benchmark in this repo, so it stays a decision rather than a fix. The
  zoomTo route needs no corpus change and lands on the same window.

  ## windowSize has to exceed the view span, and it rounds outward

  The lazy source drops any request wider than `windowSize`
  (`domain[1] - domain[0] > windowSize` and it returns without loading), and the
  interval it does load is snapped outward to multiples of `windowSize`. So:

    * the default here is `max(30000, span + 1000)`, which keeps the 19 kb
      benchmark window on the 30000 this page has always used and lets a 100 kb
      window load at all;
    * **this arm reads more bytes than the window it draws** — up to two
      windowSize-aligned blocks. That is a property of GenomeSpy's lazy source,
      not a harness setting to tune away, and `drewcheck.ts` counts the bytes so
      a report can say how much.

  ## Every failure here is silent

  `embed()` resolves, its promise does not reject, `__gsState.error` stays null,
  and GenomeSpy logs the exception itself so `pageerror` never fires. Four
  independent signals read clean on a dead page, and the instrument is paint
  quiescence — a page that throws settles immediately and reports the best
  number in the table. That is why this page records `zoomed` and `lazyLoaded`
  alongside `ready`, why `drewcheck.ts` counts bytes by URL *path*, and why the
  arm is preflighted with `toolcheck.ts` on every run rather than trusted.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>GenomeSpy harness</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        font-family: sans-serif;
      }
      #gs {
        width: 1280px;
        height: 600px;
      }
    </style>
  </head>
  <body>
    <div id="gs"></div>
    <script type="module">
      import { embed } from './genomespy/index.es.js'

      const params = new URLSearchParams(location.search)
      const track = params.get('track') ?? '20x.shortread.bam'
      const locus = params.get('loc') ?? 'chr22_mask:124000-143000'

      // "chr22_mask:124000-143000" -> ["chr22_mask", 124000, 143000]. The
      // corpus is one contig, so the size is a constant read from the .fai
      // rather than fetched; if the fixture ever grows a second contig this
      // has to become a chrom.sizes URL instead.
      const [chrom, range] = locus.split(':')
      const [start, end] = range.split('-').map(Number)
      const CONTIG_SIZE = 250001

      const windowSize = Number(params.get('window') ?? Math.max(30000, end - start + 1000))

      window.__gsState = {
        ready: false,
        error: null,
        zoomed: null,
        lazyLoaded: null,
        domain: null,
        windowSize,
      }

      // This page builds a pileup spec and nothing else. Without this guard a
      // BigWig or VCF track still gets a BAM spec, GenomeSpy dutifully asks for
      // `<track>.bw.bai`, and the only trace in results/format-support.md is a
      // bare 404 — which reads as a missing corpus file rather than as a gap in
      // this harness. GenomeSpy's lazy sources are bam, bigbed, bigwig, gff3,
      // tabix and vcf, so only the CRAM `no` belongs to the tool.
      if (!track.endsWith('.bam')) {
        const why = track.endsWith('.cram')
          ? 'genomespy 0.85.0 has no CRAM lazy source'
          : 'this harness builds a BAM pileup spec only; genomespy itself also reads bigwig, bigbed, vcf, gff3 and tabix'
        const msg = `cannot open "${track}" — ${why}`
        window.__gsState.error = msg
        throw new Error(msg)
      }

      // `paintprofile.ts` will not call the pixels settled while this is true.
      // Belt and braces here rather than a fix: this page's frames were checked
      // and it settles on a drawn pileup without the gate. It carries one anyway
      // because the failure it guards against is invisible — a page that is
      // working with nothing moving on screen reads as finished — and this arm
      // has a whole-contig frame before its zoom that is exactly that shape.
      // `ready` goes true after the zoom lands and the lazy load resolves or
      // times out, so the pixels still do all the timing.
      window.__harnessBusy = () => !window.__gsState.ready

      // Base palette, from GenomeSpy's own BAM example so the mismatch colours
      // are theirs and not ours.
      const BASE_COLORS = {
        domain: ['A', 'C', 'T', 'G', 'N'],
        range: ['#4FBF45', '#4D96E8', '#E85F78', '#E8B322', '#BDBDBD'],
      }

      const spec = {
        genomes: { hg19mod: { contigs: [{ name: chrom, size: CONTIG_SIZE }] } },
        assembly: 'hg19mod',
        // A CONTAINER root, not a bare unit view, mirroring GenomeSpy's
        // published BAM example: the assembly preflight collects requirements
        // from x/y scale *resolutions*, and a shared resolution is what a
        // container creates.
        resolve: { scale: { x: 'shared' } },
        spacing: 5,
        data: {
          lazy: {
            type: 'bam',
            url: `./data/${track}`,
            // indexUrl defaults to url + ".bai", which is how the corpus is
            // named, so it is left alone.
            windowSize,
          },
        },
        // pileup assigns each read a lane, which is the layout step igv.js and
        // JBrowse also perform; leaving it out would compare a stack of reads
        // against a single overplotted row.
        transform: [{ type: 'pileup', start: 'start', end: 'end', as: 'lane' }],
        vconcat: [
          // Coverage with mismatch support, which is what JBrowse's SNP-coverage
          // track draws above its pileup and what igv draws above its own.
          {
            name: 'coverage',
            height: 40,
            resolve: { scale: { color: 'independent' } },
            layer: [
              {
                name: 'depth',
                transform: [
                  { type: 'flattenCigar', copyFields: ['chrom'] },
                  { type: 'filter', expr: "datum.cigarType == 'aligned'" },
                  { type: 'collect', sort: { field: ['chrom', 'cigarStart'] } },
                  {
                    type: 'coverage',
                    chrom: 'chrom',
                    start: 'cigarStart',
                    end: 'cigarEnd',
                    as: 'coverage',
                    asStart: 'start',
                    asEnd: 'end',
                  },
                ],
                mark: 'rect',
                encoding: {
                  // `name` is what makes the resolution reachable from the API as
                  // `getScaleResolutionByName('pos')`. No `domain` here, and none
                  // in a root `scales` block either — see the header. It rides on
                  // the first view because the root resolves x as shared, so one
                  // name names the resolution every view draws through.
                  x: {
                    chrom: 'chrom', pos: 'start', type: 'locus', band: 0,
                    scale: { name: 'pos' },
                  },
                  x2: { chrom: 'chrom', pos: 'end', band: 0 },
                  y: { field: 'coverage', type: 'quantitative' },
                  color: { value: '#d0d0d0' },
                },
              },
              {
                name: 'mismatch-summary',
                transform: [
                  { type: 'filter', expr: 'datum.md != null' },
                  { type: 'alignmentMismatches', copyFields: ['chrom'] },
                  { type: 'aggregate', groupby: ['chrom', 'mismatchStart', 'base'] },
                  {
                    type: 'stack',
                    field: 'count',
                    groupby: ['chrom', 'mismatchStart'],
                    sort: { field: 'base', order: 'ascending' },
                    as: ['mismatchCount0', 'mismatchCount1'],
                  },
                  { type: 'formula', expr: 'datum.mismatchStart + 1', as: 'mismatchEnd' },
                ],
                mark: 'rect',
                encoding: {
                  x: { chrom: 'chrom', pos: 'mismatchStart', type: 'locus', band: 0 },
                  x2: { chrom: 'chrom', pos: 'mismatchEnd', band: 0 },
                  y: { field: 'mismatchCount0', type: 'quantitative' },
                  y2: { field: 'mismatchCount1' },
                  color: { field: 'base', type: 'nominal', scale: BASE_COLORS, legend: null },
                },
              },
            ],
          },
          {
            name: 'read-alignments',
            resolve: { scale: { color: 'independent' } },
            encoding: {
              y: {
                field: 'lane',
                type: 'index',
                scale: { padding: 0.25, reverse: true, zoom: false },
              },
            },
            layer: [
              {
                // An arrow rather than a rect, because JBrowse and igv both draw
                // a pointed read that states its strand.
                name: 'read-backbone',
                mark: {
                  type: 'arrow',
                  style: 'arrow-block',
                  minStemLength: 10,
                  fill: '#e0e0e0',
                  stroke: '#c4c4c4',
                  strokeWidth: 0.5,
                },
                encoding: {
                  x: { chrom: 'chrom', pos: 'start', type: 'locus', band: 0 },
                  x2: { chrom: 'chrom', pos: 'end', band: 0 },
                  direction: {
                    field: 'strand',
                    type: 'nominal',
                    scale: { domain: ['+', '-'], range: ['forward', 'reverse'] },
                  },
                },
              },
              {
                name: 'cigar-overlays',
                transform: [{ type: 'flattenCigar', copyFields: ['chrom', 'lane'] }],
                encoding: {
                  x: { chrom: 'chrom', pos: 'cigarStart', type: 'locus', band: 0 },
                  x2: { chrom: 'chrom', pos: 'cigarEnd', band: 0 },
                },
                layer: [
                  {
                    name: 'deletions',
                    transform: [{ type: 'filter', expr: "datum.cigarType == 'deletion'" }],
                    layer: [
                      { mark: { type: 'rect', color: 'white', minWidth: 1 } },
                      { mark: { type: 'rule', color: '#222', minLength: 1 } },
                    ],
                  },
                  {
                    name: 'skips',
                    transform: [{ type: 'filter', expr: "datum.cigarType == 'skip'" }],
                    mark: { type: 'rule', color: '#6b6b6b', strokeDash: [2, 2], minLength: 1 },
                  },
                  {
                    // A 1 px rect rather than the example's "I" glyph. An
                    // insertion is zero bases wide, so `minWidth` is what makes
                    // it visible, and at 15 bp/px a letter would be 1/15th of a
                    // pixel — JBrowse and igv both draw a tick here and no arm
                    // draws readable text, so a glyph would price something
                    // nobody displays.
                    name: 'insertions',
                    transform: [{ type: 'filter', expr: "datum.cigarType == 'insertion'" }],
                    mark: { type: 'rect', color: '#800080', minWidth: 1 },
                  },
                ],
              },
              {
                name: 'mismatches',
                transform: [
                  { type: 'filter', expr: 'datum.md != null' },
                  { type: 'alignmentMismatches', copyFields: ['chrom', 'lane'] },
                ],
                mark: { type: 'rect', minWidth: 1 },
                encoding: {
                  x: { chrom: 'chrom', pos: 'mismatchStart', type: 'locus', band: 0 },
                  x2: { chrom: 'chrom', pos: 'mismatchEnd', band: 0 },
                  color: { field: 'base', type: 'nominal', scale: BASE_COLORS, legend: null },
                },
              },
            ],
          },
        ],
      }

      const LAZY_TIMEOUT_MS = 60000

      embed(document.getElementById('gs'), spec)
        .then(async api => {
          window.gsApi = api
          const res = api.getScaleResolutionByName('pos')
          if (!res) {
            throw new Error('no scale resolution named "pos" — the spec lost its name')
          }
          await res.zoomTo([
            { chrom, pos: start },
            { chrom, pos: end },
          ])
          window.__gsState.zoomed = true
          window.__gsState.domain = res.getDomain()
          // A lazy load that never resolves is the failure this arm is prone to,
          // so it is raced rather than awaited: a hung page should say so in its
          // own state, not stall the instrument into a timeout.
          window.__gsState.lazyLoaded = await Promise.race([
            api.awaitVisibleLazyData().then(() => 'ok'),
            new Promise(r => setTimeout(() => r('timeout'), LAZY_TIMEOUT_MS)),
          ])
          window.__gsState.ready = true
        })
        .catch(e => {
          window.__gsState.error = String(e)
          console.error(e)
        })
    </script>
  </body>
</html>
